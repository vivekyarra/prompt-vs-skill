[project]
name = "handoff-grader"
version = "0.1.0"
description = "Independent, deterministic grader for Flagsmith A/B-test integrations"
requires-python = ">=3.10"
dependencies = ["playwright>=1.49"]

[project.optional-dependencies]
proxy = ["mitmproxy>=11"]
test = ["pytest", "mitmproxy>=11"]

[tool.setuptools]
packages = ["grader"]
package-dir = { grader = "." }
