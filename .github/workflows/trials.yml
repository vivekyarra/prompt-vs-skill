name: trials

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of trials in this batch"
        required: true
        default: "3"
      model:
        description: "Model id (overrides the HANDOFF_MODEL variable if set)"
        required: false
        default: "MiniMaxAI/MiniMax-M3.1-Flash"
      max_turns:
        description: "Turn limit (overrides the HANDOFF_MAX_TURNS variable if set)"
        required: false
        default: "220"
      max_tokens:
        description: "Token limit (overrides the HANDOFF_MAX_TOKENS variable if set)"
        required: false
        default: "12000000"
      price_in:
        description: "USD per 1M input tokens (cost accounting)"
        required: false
        default: "0.15"
      price_out:
        description: "USD per 1M output tokens (cost accounting)"
        required: false
        default: "0.6"
      environment:
        description: "GitHub environment (development = pilot, production = real run)"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - production
      assign:
        description: "Variant assignment: flagsmith (real), local (PILOT ONLY; refused for production) or rollout (plain flag read after the experiment ended; no events; stage forced to rollout)"
        required: true
        default: "flagsmith"
        type: choice
        options:
          - flagsmith
          - local
          - rollout
      stage:
        description: "Record stage: primary (the experiment), replication, followup (skill v2 follow-up), or rollout (forced by assign=rollout)"
        required: true
        default: "primary"
        type: choice
        options:
          - primary
          - replication
          - followup
          - rollout
      skill_dir:
        description: "Skill folder installed for the skill arm (repo-relative)"
        required: false
        default: "skill/flagsmith-ab-test"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      indexes: ${{ steps.gen.outputs.indexes }}
    steps:
      - id: gen
        env:
          COUNT: ${{ inputs.count }}
        run: |
          case "$COUNT" in ''|*[!0-9]*) echo "count must be a positive integer"; exit 1;; esac
          if [ "$COUNT" -lt 1 ] || [ "$COUNT" -gt 256 ]; then echo "count must be 1..256"; exit 1; fi
          echo "indexes=$(python3 -c "import json,os;print(json.dumps(list(range(1,int(os.environ['COUNT'])+1))))")" >> "$GITHUB_OUTPUT"

  trial:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The environment (development|production) selects which environment-scoped secrets and
    # variables apply. Secret NAMES are identical in both environments; each environment stores
    # its own FS_EXPERIMENT_SERVER_KEY (so pilot and real run hit different Flagsmith environments).
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        index: ${{ fromJson(needs.prepare.outputs.indexes) }}
    env:
      HANDOFF_ASSIGN: ${{ inputs.assign }}
      HANDOFF_STAGE: ${{ inputs.stage }}
      HANDOFF_ENVIRONMENT: ${{ inputs.environment }}
      HANDOFF_SKILL_DIR: ${{ inputs.skill_dir }}
      FS_EXPERIMENT_SERVER_KEY: ${{ secrets.FS_EXPERIMENT_SERVER_KEY }}
      FS_SANDBOX_CLIENT_KEY: ${{ secrets.FS_SANDBOX_CLIENT_KEY }}
      FS_SANDBOX_SERVER_KEY: ${{ secrets.FS_SANDBOX_SERVER_KEY }}
      FS_SANDBOX_ADMIN_KEY: ${{ secrets.FS_SANDBOX_ADMIN_KEY }}
      FS_SANDBOX_PROJECT_ID: ${{ vars.FS_SANDBOX_PROJECT_ID || secrets.FS_SANDBOX_PROJECT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HANDOFF_MAX_TURNS: ${{ inputs.max_turns || vars.HANDOFF_MAX_TURNS || secrets.HANDOFF_MAX_TURNS }}
      HANDOFF_MAX_TOKENS: ${{ inputs.max_tokens || vars.HANDOFF_MAX_TOKENS || secrets.HANDOFF_MAX_TOKENS }}
      HANDOFF_MODEL: ${{ inputs.model || vars.HANDOFF_MODEL || secrets.HANDOFF_MODEL }}
      HANDOFF_AGENT: ${{ vars.HANDOFF_AGENT || 'opencode' }}
      # The Nebius key may be stored under the secret name ANTHROPIC_API_KEY.
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY || secrets.ANTHROPIC_API_KEY }}
      NEBIUS_BASE_URL: ${{ vars.NEBIUS_BASE_URL }}
      HANDOFF_PRICE_IN_PER_M: ${{ inputs.price_in || vars.HANDOFF_PRICE_IN_PER_M }}
      HANDOFF_PRICE_OUT_PER_M: ${{ inputs.price_out || vars.HANDOFF_PRICE_OUT_PER_M }}
      HANDOFF_CONTEXT_LIMIT: ${{ vars.HANDOFF_CONTEXT_LIMIT }}
      HANDOFF_OUTPUT_LIMIT: ${{ vars.HANDOFF_OUTPUT_LIMIT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.63.0 mitmproxy requests flagsmith flask
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Install Flagsmith CLI
        run: |
          (curl -fsSL https://get.flagsmith.com | sh) || npm i -g @flagsmith/cli
          flagsmith --help > /dev/null 2>&1 || echo "WARNING: flagsmith CLI not on PATH after install"
      - name: Install Claude Code
        if: ${{ env.HANDOFF_AGENT == '' || env.HANDOFF_AGENT == 'claude' }}
        run: npm i -g @anthropic-ai/claude-code
      - name: Install OpenCode
        if: ${{ env.HANDOFF_AGENT == 'opencode' }}
        run: npm i -g opencode-ai@1.19.6 && opencode --version
      - name: Run trial
        run: python -m runner --trial-id "trial-${{ github.run_id }}-${{ matrix.index }}" --out-dir out
      - name: Upload trial artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-${{ github.run_id }}-${{ matrix.index }}
          path: out
          if-no-files-found: warn
          retention-days: 30
