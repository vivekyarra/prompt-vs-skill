name: grader
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  grader-selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install grader dependencies
        run: pip install pytest playwright==1.63.0 mitmproxy
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Grader self-tests (references pass, broken apps fail their check, determinism)
        run: python -m pytest grader -m grader -q
  runner-grader-e2e:
    # Runner + grader wired together, no credentials: a fake agent applies the reference integration
    # (must pass and send integration_verified); the untouched baseline must fail C2.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install pytest playwright==1.63.0 mitmproxy flask requests
      - run: python -m playwright install --with-deps chromium
      - name: Reference integration passes end to end
        run: |
          python -m runner --trial-id trial-e2e-2 --out-dir out/ref --dry-run --fake-agent-apply-reference
          python -c "import json,sys; d=json.load(open('out/ref/trial_record.json')); print(d['checks']); sys.exit(0 if d['passed'] and not d['runner_error'] and d['events_sent']==['integration_verified'] else 1)"
      - name: Untouched baseline fails
        run: |
          python -m runner --trial-id trial-e2e-3 --out-dir out/base --dry-run
          python -c "import json,sys; d=json.load(open('out/base/trial_record.json')); sys.exit(0 if (not d['passed'] and not d['checks']['C2'] and not d['runner_error']) else 1)"
